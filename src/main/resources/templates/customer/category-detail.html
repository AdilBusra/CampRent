<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Category Detail - CampRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F4F4F2] text-slate-800 font-sans antialiased">

<div th:replace="~{fragments/customer-navbar :: customerNavbar('categories')}"></div>

<main class="pt-24 min-h-screen">

  <section class="max-w-7xl mx-auto px-8 pb-16">

    <a th:href="@{/customer/categories}"
       class="text-sm font-semibold text-[#E27252] hover:underline">
      ← Back to Categories
    </a>

    <section class="mt-6 mb-8">
      <!-- NAMA KATEGORI DIAMBIL DINAMIS DARI CONTROLLER -->
      <h1 class="text-3xl font-bold text-[#19381C]"
          th:text="${categoryName}">
        Nama Kategori
      </h1>

      <p class="text-sm text-gray-500 mt-2">
        Browse available equipment from this category.
      </p>
    </section>

    <!-- FORM FILTER PENCARIAN DI DALAM KATEGORI -->
    <section class="mb-8">
      <form class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex gap-3">
        <input type="text"
               placeholder="Search equipment in this category..."
               class="flex-1 rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#E27252]">

        <button type="button"
                class="rounded-xl bg-[#E27252] px-6 py-3 text-white font-semibold hover:bg-[#c85f41]">
          Search
        </button>
      </form>
    </section>

    <!-- KONDISI 1: JIKA BARANG DI KATEGORI INI KOSONG -->
    <div th:if="${#lists.isEmpty(listKatalog)}" class="mt-12 text-center py-12 bg-white rounded-3xl border border-dashed">
      <span class="text-6xl">🎒</span>
      <h3 class="mt-4 text-lg font-bold text-gray-500">Belum ada peralatan di kategori ini</h3>
      <p class="text-sm text-gray-400">Toko mitra kami belum mengunggah peralatan untuk kategori ini.</p>
    </div>

    <!-- KONDISI 2: TAMPILKAN DAFTAR BARANG MENGGUNAKAN FRAGMENT EQUIPMENT CARD -->
    <section th:if="${!#lists.isEmpty(listKatalog)}"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

      <th:block th:each="peralatanItem : ${listKatalog}">
        <div th:replace="~{fragments/equipment-card :: productCard(${peralatanItem})}"></div>
      </th:block>

    </section>

  </section>

</main>

</body>
</html>
