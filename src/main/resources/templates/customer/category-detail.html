<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Category Detail - CampRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F4F4F2] text-slate-800 font-sans antialiased">

<div th:replace="~{fragments/customer-navbar :: customerNavbar('categories')}"></div>

<main class="pt-24 min-h-screen">

  <section class="max-w-7xl mx-auto px-8 pb-16">

    <a th:href="@{/customer/categories}"
       class="text-sm font-semibold text-[#E27252] hover:underline">
      ← Back to Categories
    </a>

    <section class="mt-6 mb-8">
      <h1 class="text-3xl font-bold text-[#19381C]"
          th:text="${categoryName}">
        Tent
      </h1>

      <p class="text-sm text-gray-500 mt-2">
        Browse available equipment from this category.
      </p>
    </section>

    <section class="mb-8">
      <form class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex gap-3">
        <input type="text"
               placeholder="Search equipment in this category..."
               class="flex-1 rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#E27252]">

        <button type="button"
                class="rounded-xl bg-[#E27252] px-6 py-3 text-white font-semibold hover:bg-[#c85f41]">
          Search
        </button>
      </form>
    </section>

    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

      <article class="overflow-hidden rounded-2xl bg-white border border-gray-100 shadow-sm hover:shadow-md transition">
        <div class="h-52 bg-[#EAE5D8] flex items-center justify-center text-7xl">
          🏕️
        </div>

        <div class="p-5">
          <div class="flex items-center justify-between">
            <p class="text-xs font-bold text-[#E27252]"
               th:text="${categoryName}">
              TENT
            </p>

            <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
                            Stock 5
                        </span>
          </div>

          <h3 class="mt-3 text-xl font-bold text-[#19381C]">
            Tent Dome Borneo 4
          </h3>

          <p class="text-sm text-gray-500 mt-1">
            Eiger
          </p>

          <p class="mt-3 text-sm">
            By
            <a th:href="@{/customer/store/1}"
               class="font-semibold text-[#19381C] hover:text-[#E27252]">
              Mountain Adventure
            </a>
          </p>

          <p class="mt-4 text-sm text-gray-500">
            Comfortable tent for camping with friends or family.
          </p>

          <div class="mt-5 flex items-end justify-between">
            <div>
              <p class="text-xs text-gray-500">Rental Price</p>
              <p class="text-xl font-bold text-[#E27252]">
                Rp 80.000
                <span class="text-sm text-gray-500 font-normal">/day</span>
              </p>
            </div>

            <a th:href="@{/customer/equipment/1}"
               class="rounded-xl bg-[#19381C] px-4 py-3 text-sm text-white font-semibold">
              Detail
            </a>
          </div>
        </div>
      </article>

    </section>

  </section>

</main>

</body>
</html>
