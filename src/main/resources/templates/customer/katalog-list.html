<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Customer Catalog - CampRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8F5EC] text-[#12372A]">

<div th:replace="~{fragments/customer-navbar :: customerNavbar('catalog')}">
  <nav class="mx-auto max-w-7xl px-6 py-4 flex items-center justify-between">
    <a th:href="@{/customer/katalog}" class="text-2xl font-bold">
      Camp<span class="text-[#F28C73]">Rent</span>
    </a>

    <div class="hidden md:flex items-center gap-8 text-sm font-semibold">
      <a href="#" class="hover:text-[#F28C73]">Home</a>
      <a th:href="@{/customer/katalog}" class="text-[#F28C73]">Catalog</a>
      <a href="#" class="hover:text-[#F28C73]">My Booking</a>
      <a href="#" class="hover:text-[#F28C73]">Cart</a>
    </div>

    <form th:action="@{/logout}" method="post">
      <button type="submit"
              class="rounded-full bg-[#12372A] px-5 py-2 text-white text-sm font-semibold hover:bg-[#1f4d3b]">
        Logout
      </button>
    </form>
  </nav>
</div>

<main class="pt-20 bg-[#F4F4F2] min-h-screen">

  <section class="bg-[#F4F4F2] border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-8 py-8">

      <div class="mb-5">
        <h1 class="text-3xl font-bold text-[#19381C]">Catalog</h1>
        <p class="text-sm text-gray-500 mt-1">
          Browse all available camping gear from CampRent store partners.
        </p>
      </div>

      <form th:action="@{/customer/katalog}" method="get"
            class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex gap-3">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search by equipment name or brand..."
               class="flex-1 rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#E27252]">

        <button type="submit"
                class="rounded-xl bg-[#E27252] px-6 py-3 text-white font-semibold hover:bg-[#c85f41]">
          Search
        </button>

      </form>

    </div>
  </section>

  <section th:if="${#lists.isEmpty(listKatalog)}"
           class="max-w-7xl mx-auto px-8 py-8">
    <div class="rounded-3xl bg-white border border-gray-100 p-12 text-center shadow-sm">
      <div class="text-6xl mb-4">🎒</div>
      <h3 class="text-xl font-bold text-[#19381C]">No Equipment Found</h3>
      <p class="mt-2 text-sm text-gray-500">
        Try another keyword or wait until store partners add equipment.
      </p>
    </div>
  </section>

  <section th:if="${!#lists.isEmpty(listKatalog)}"
           class="max-w-7xl mx-auto px-8 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

    <th:block th:each="peralatanItem : ${listKatalog}">
      <div th:replace="~{fragments/equipment-card :: productCard(${peralatanItem})}"></div>
    </th:block>

  </section>

</main>

</body>
</html>
