<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Customer Catalog - CampRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F4F2] text-[#12372A] font-sans antialiased">

<!-- Memanggil Navbar Customer -->
<div th:replace="~{fragments/customer-navbar :: customerNavbar('catalog')}"></div>

<main class="pt-24 bg-[#F4F4F2] min-h-screen">

  <!-- Bagian Header & Form Pencarian -->
  <section class="bg-[#F4F4F2]">
    <div class="max-w-7xl mx-auto px-8 py-4">

      <div class="mb-5">
        <h1 class="text-3xl font-bold text-[#19381C]">Catalog</h1>
        <p class="text-sm text-gray-500 mt-1">
          Browse all available camping gear from CampRent store partners.
        </p>
      </div>

      <form th:action="@{/customer/katalog}" method="get"
            class="bg-white rounded-2xl shadow-sm border border-[#12372A]/10 p-4 flex gap-3">
        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search by equipment name or brand..."
               class="flex-1 rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#E27252]">
        <button type="submit"
                class="rounded-xl bg-[#E27252] px-8 py-3 text-white font-semibold hover:bg-[#c85f41] transition">
          Search
        </button>
      </form>

    </div>
  </section>

  <!-- Jika Katalog Kosong -->
  <section th:if="${#lists.isEmpty(listKatalog)}"
           class="max-w-7xl mx-auto px-8 py-8">
    <div class="rounded-3xl bg-white border border-gray-100 p-12 text-center shadow-sm">
      <div class="text-6xl mb-4">🎒</div>
      <h3 class="text-xl font-bold text-[#19381C]">No Equipment Found</h3>
      <p class="mt-2 text-sm text-gray-500">
        Try another keyword or wait until store partners add equipment.
      </p>
    </div>
  </section>

  <!-- Grid Utama Menampilkan Kartu Barang -->
  <section th:if="${!#lists.isEmpty(listKatalog)}"
           class="max-w-7xl mx-auto px-8 py-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <th:block th:each="peralatanItem : ${listKatalog}">
      <div th:replace="~{fragments/equipment-card :: productCard(${peralatanItem})}"></div>
    </th:block>
  </section>

</main>

<!-- JAVASCRIPT AJAX YANG SINKRON 100% DENGAN TOMBOL ADD TO CART -->
<script>
  function tambahKeKeranjangAJAX(event, peralatanId) {
      event.preventDefault();

      fetch('/customer/booking/' + peralatanId, {
          method: 'GET'
      })
      .then(response => {
          if (response.redirected || response.ok) {
              showNotification("🎒 Item berhasil dimasukkan ke keranjang!");
              setTimeout(() => { window.location.href = "/customer/cart"; }, 1000);
          } else {
              showNotification("❌ Gagal menambahkan item.", true);
          }
      })
      .catch(error => {
          console.error("Error:", error);
          showNotification("❌ Terjadi kesalahan koneksi.", true);
      });
  }

  function showNotification(message, isError = false) {
      const oldToast = document.getElementById("toast-notif");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.id = "toast-notif";
      toast.innerText = message;
      toast.className = `fixed bottom-5 right-5 z-50 px-6 py-4 rounded-xl text-white font-semibold shadow-lg transition-all duration-300 transform translate-y-0 ${
          isError ? 'bg-red-500' : 'bg-[#12372A]'
      }`;

      document.body.appendChild(toast);

      setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translate-y-2";
          setTimeout(() => toast.remove(), 300);
      }, 3000);
  }
</script>

</body>
</html>
