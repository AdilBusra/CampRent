<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Categories - CampRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F4F2] text-slate-800 font-sans antialiased">

<div th:replace="~{fragments/customer-navbar :: customerNavbar('categories')}"></div>

<main class="pt-24 min-h-screen">

  <section class="max-w-7xl mx-auto px-8 mb-8">
    <h1 class="text-3xl font-bold text-[#19381C]">Categories</h1>
    <p class="text-sm text-gray-500 mt-2">Explore outdoor rental equipment by category.</p>
  </section>

  <section class="max-w-7xl mx-auto px-8 mb-10">
    <form th:action="@{/customer/categories}" method="get" class="bg-white rounded-2xl border border-[#12372A]/10 shadow-sm p-4 flex gap-3">
      <input type="text"
             name="keyword"
             th:value="${keyword}"
             placeholder="Search category..."
             class="flex-1 rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#F28C73]">
      <button type="submit"
              class="rounded-xl bg-[#F28C73] px-6 py-3 text-white font-semibold hover:bg-[#e17860] transition">
        Search
      </button>
    </form>
  </section>

  <section class="max-w-7xl mx-auto px-8 pb-16">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

      <div th:if="${#lists.isEmpty(listKategori)}" class="col-span-full text-center py-10">
        <p class="text-gray-500 font-medium">Category not found.</p>
      </div>

      <th:block th:each="kat : ${listKategori}">
        <div th:replace="~{fragments/equipment-category-card :: categoryCard(${kat})}"></div>
      </th:block>

    </div>
  </section>

</main>

</body>
</html>
