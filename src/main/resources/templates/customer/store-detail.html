<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="${store.namaToko} + ' - CampRent'">Store Detail - CampRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F4F4F2] text-slate-800 font-sans antialiased">

<div th:replace="~{fragments/customer-navbar :: customerNavbar('catalog')}"></div>

<main class="pt-24 min-h-screen">
  <section class="max-w-7xl mx-auto px-8 pb-16">

    <a th:href="@{/customer/katalog}" class="text-sm font-semibold text-[#E27252] hover:underline">
      ← Back to Catalog
    </a>

    <section class="mt-6 overflow-hidden rounded-3xl bg-white border border-gray-100 shadow-sm">
      <div class="relative h-64 overflow-hidden">
        <img th:src="@{/images/placeholders/store-banner.png}"
             alt="Store Banner"
             class="absolute inset-0 h-full w-full object-cover">

        <div class="absolute inset-0 bg-[#19381C]/65"></div>

        <div class="relative z-10 h-full flex items-center p-8 gap-6 text-white">
          <div class="w-20 h-20 rounded-full bg-white text-[#19381C] flex items-center justify-center text-3xl font-bold shadow-md"
               th:text="${#strings.substring(store.namaToko, 0, 1)}">
            M
          </div>

          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-3xl font-bold" th:text="${store.namaToko}">Nama Toko</h1>
              <span th:if="${store.statusVerifikasi == 'VERIFIED'}"
                    class="bg-blue-500 text-white text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full shadow-sm">
                ✓ Verified Partner
              </span>
            </div>
            <p class="text-sm text-gray-200 mt-1" th:text="'📍 ' + ${store.alamat}">Alamat Toko</p>
            <p class="text-xs text-green-300 mt-1 font-semibold" th:text="'📞 Hubungi: ' + ${store.nomorTelepon}">No Telepon</p>
          </div>
        </div>
      </div>
    </section>

    <div class="mt-12 flex items-center justify-between border-b border-gray-200 pb-4">
      <div>
        <h2 class="text-2xl font-bold text-[#19381C]">Equipment Catalog</h2>
        <p class="text-xs text-gray-500 mt-1" th:text="'Menampilkan semua alat camping yang disewakan oleh ' + ${store.namaToko}">
          Daftar peralatan ready sewa.
        </p>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(listKatalog)}" class="mt-12 text-center py-12 bg-white rounded-3xl border border-dashed">
      <span class="text-6xl">🏕️</span>
      <h3 class="mt-4 text-lg font-bold text-gray-500">Belum ada peralatan sewa</h3>
      <p class="text-sm text-gray-400">Toko ini belum mengunggah peralatan camping untuk saat ini.</p>
    </div>

    <div th:if="${!#lists.isEmpty(listKatalog)}" class="mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <th:block th:each="alat : ${listKatalog}">

        <div th:replace="~{fragments/equipment-card :: productCard(${alat})}"></div>

      </th:block>

    </div>

  </section>
</main>

</body>
</html>
