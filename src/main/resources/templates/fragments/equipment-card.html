<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="productCard(peralatan)"
     th:onclick="|window.location.href='@{/customer/equipment/detail/{id}(id=${peralatan.id})}'|"
     class="cursor-pointer overflow-hidden rounded-2xl bg-white border border-gray-100 shadow-sm hover:shadow-md transition duration-300">

    <div class="relative h-56 bg-[#EAE5D8] flex items-center justify-center overflow-hidden rounded-t-3xl">
        <!-- Jika TIDAK kosong dan BUKAN file default -->
        <img th:if="${!#strings.isEmpty(peralatan.fotoPeralatan) and peralatan.fotoPeralatan != 'default-equipment.jpg'}"
             th:src="@{'/uploads/peralatan/' + ${peralatan.fotoPeralatan}}"
             alt="Equipment Photo"
             class="w-full h-full object-cover">

        <!-- Jika kosong ATAU berisi file default -->
        <div th:if="${#strings.isEmpty(peralatan.fotoPeralatan) or peralatan.fotoPeralatan == 'default-equipment.jpg'}"
             class="text-7xl">🏕️</div>
    </div>

    <div class="p-5">
        <div class="flex items-center justify-between">
            <p class="text-xs font-bold text-[#E27252]"
               th:text="${peralatan.kategori != null ? peralatan.kategori.namaKategori : 'GENERAL'}">
                CATEGORY
            </p>
            <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
                Stock <span th:text="${peralatan.stok}">0</span>
            </span>
        </div>

        <h3 class="mt-3 text-xl font-bold text-[#19381C]" th:text="${peralatan.namaAlat}">
            Tent Dome Borneo 4
        </h3>

        <p class="text-sm text-gray-500 mt-1" th:text="${peralatan.merek}">Merek</p>

        <p class="mt-3 text-sm text-gray-600" th:if="${peralatan.store != null}">
            By <span class="font-semibold text-[#19381C]" th:text="${peralatan.store.namaToko}">Nama Toko</span>
        </p>

        <p class="mt-4 text-sm text-gray-500 line-clamp-2" th:text="${peralatan.deskripsi}">
            Comfortable tent for camping with friends or family.
        </p>

        <div class="mt-5 flex items-end justify-between">
            <div>
                <p class="text-xs text-gray-500">Rental Price</p>
                <p class="text-xl font-bold text-[#E27252]">
                    Rp <span th:text="${#numbers.formatDecimal(peralatan.hargaSewaPerHari, 0, 'POINT', 0, 'COMMA')}">0</span>
                    <span class="text-sm text-gray-500 font-normal">/day</span>
                </p>
            </div>

            <div th:onclick="event.stopPropagation();">
                <form th:onsubmit="tambahKeKeranjangAJAX(event, [[${peralatan.id}]])">
                    <button type="submit"
                            class="rounded-xl bg-[#19381C] px-4 py-3 text-sm text-white font-semibold hover:bg-[#234e27] transition duration-200">
                        Add to Cart
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // Cegah fungsi dideklarasikan ulang jika card dilooping berkali-kali
        if (typeof tambahKeKeranjangAJAX === 'undefined') {
            function tambahKeKeranjangAJAX(event, peralatanId) {
                event.preventDefault();

                const formData = new FormData();
                formData.append("peralatanId", peralatanId);

                fetch('/customer/cart/add', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        showNotification("🎒 Item berhasil dimasukkan ke keranjang!");
                    } else {
                        showNotification("❌ Gagal menambahkan item.", true);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    showNotification("❌ Terjadi kesalahan koneksi.", true);
                });
            }
        }

        if (typeof showNotification === 'undefined') {
            function showNotification(message, isError = false) {
                const oldToast = document.getElementById("toast-notif");
                if (oldToast) oldToast.remove();

                const toast = document.createElement("div");
                toast.id = "toast-notif";
                toast.innerText = message;

                toast.className = `fixed bottom-5 right-5 z-50 px-6 py-4 rounded-xl text-white font-semibold shadow-lg transition-all duration-300 transform translate-y-0 ${
                    isError ? 'bg-red-500' : 'bg-[#12372A]'
                }`;

                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = "0";
                    toast.style.transform = "translate-y-2";
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }
    </script>
</div>

</body>
</html>
