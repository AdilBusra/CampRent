<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head><title></title></head>
<body>

<div th:fragment="admin-sidebar" class="w-64 bg-[#19381C] text-white min-h-screen flex flex-col shadow-xl fixed left-0 top-0">

    <div class="p-6 border-b border-[#244f28] flex items-center gap-3">
        <span class="text-2xl">⛺</span>
        <div class="font-bold text-xl tracking-wider">CampRent <span class="text-xs bg-[#E27252] px-2 py-0.5 rounded-full">ADMIN</span></div>
    </div>

    <nav class="flex-1 p-4 space-y-2 text-sm">
        <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#244f28] hover:text-white transition duration-200">
            <span>📊</span> Dashboard
        </a>
        <a href="/admin/stores" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#244f28] hover:text-white transition duration-200">
            <span>🏪</span> Validasi Mitra Toko
        </a>
        <a href="/admin/categories" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#244f28] hover:text-white transition duration-200">
            <span>📁</span> Kelola Kategori Alat
        </a>
        <a href="/store/transaksi" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#244f28] hover:text-white transition duration-200">
            <span>📑</span> Riwayat Transaksi Global
        </a>
    </nav>

    <div class="p-4 border-t border-[#244f28] text-xs space-y-3">
        <div class="flex items-center gap-2 px-2 text-gray-400">
            <span>👤</span> <span>Logged in as Admin</span>
        </div>
        <form th:action="@{/logout}" method="POST" class="w-full m-0 p-0">
            <button type="submit" class="flex items-center justify-center gap-2 w-full bg-[#E27252] hover:bg-[#c85f41] text-white font-semibold py-2 rounded-md transition duration-200 shadow cursor-pointer text-sm">
                <span>🚪</span> Keluar Sistem
            </button>
        </form>
    </div>
</div>

</body>
</html>
