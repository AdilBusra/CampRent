<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="categoryCard(kat)"
     class="group overflow-hidden rounded-2xl bg-white border border-[#12372A]/10 shadow-sm hover:shadow-lg transition duration-300">

    <a th:href="@{/customer/categories/{categoryName}(categoryName=${kat.namaKategori})}" class="block">

        <div class="relative h-52 bg-[#EAE5D8] flex items-center justify-center overflow-hidden">
            <div class="text-7xl group-hover:scale-110 transition-transform duration-300"
                 th:text="${kat.namaKategori == null ? '🏕️' :
                           (#strings.toLowerCase(kat.namaKategori).contains('tenda') ? '⛺' :
                           (#strings.toLowerCase(kat.namaKategori).contains('carrier') or #strings.toLowerCase(kat.namaKategori).contains('tas') ? '🎒' :
                           (#strings.toLowerCase(kat.namaKategori).contains('sepatu') ? '🥾' :
                           (#strings.toLowerCase(kat.namaKategori).contains('masak') or #strings.toLowerCase(kat.namaKategori).contains('kompor') ? '🍳' : '🏕️'))))}">
                🏕️
            </div>

            <span class="absolute top-4 left-4 rounded-full bg-[#12372A] px-3 py-1 text-xs font-bold text-white">
                Grup Alat
            </span>
        </div>

        <div class="p-5 text-center">
            <h3 class="text-xl font-bold text-[#19381C] group-hover:text-[#F28C73] transition duration-200"
                th:text="${kat.namaKategori}">
                Nama Kategori
            </h3>
            <p class="text-sm text-gray-500 mt-1">Outdoor Equipment</p>

            <div class="mt-4 border-t border-gray-100 pt-3">
                <span class="text-xs font-semibold text-[#F28C73] group-hover:underline">
                    Lihat Peralatan ›
                </span>
            </div>
        </div>

    </a>
</div>

</body>
</html>
